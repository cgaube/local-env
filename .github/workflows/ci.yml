# Typecheck, lint, format, test and build every pull request: the checks of
# `bun run check` (the pre-push hook), then the changeset, the tests and the
# build
name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The changeset check compares the branch with main
          fetch-depth: 0

      # Bun and Node, as pinned in mise.toml
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      # Each check runs even when an earlier one failed: every result is
      # reported
      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        if: ${{ !cancelled() }}
        run: bun run lint

      - name: Format
        if: ${{ !cancelled() }}
        run: bun run fmt:check

      # The docs site builds: a dead link between pages fails it
      - name: Docs
        if: ${{ !cancelled() }}
        run: bun run docs:build

      # A change to the files in changedFilePatterns (.changeset/config.json)
      # needs a changeset
      - name: Changeset
        if: ${{ !cancelled() }}
        run: bun run changeset status --since=origin/main

      - name: Test the CLI
        if: ${{ !cancelled() }}
        run: bun run test:cli

      - name: Test the web app
        if: ${{ !cancelled() }}
        run: bun run test:web

      - name: Build
        if: ${{ !cancelled() }}
        run: bun run compile
