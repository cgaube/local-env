# Builds docs/ into the docs site (VitePress, docs/.vitepress/) and publishes
# it to GitHub Pages on every merge to main. Pull requests build it in CI.
name: Docs

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - package.json
      - bun.lock
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time: the last merge wins, a running deploy finishes
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # lastUpdated reads the date of each page from git
          fetch-depth: 0

      # Bun, as pinned in mise.toml
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6

      # Without the scripts: `prepare` compiles the CLI
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build the site
        run: bun run docs:build

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
