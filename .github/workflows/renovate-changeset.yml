# Adds a patch changeset to Renovate's pull requests, which CI requires when
# they change bun.lock or the images (changedFilePatterns in
# .changeset/config.json). It commits as the release GitHub App: its commit
# runs CI again, and Renovate ignores it (gitIgnoredAuthors in
# .github/renovate.json5), so it still rebases the branch. A rebase drops the
# changeset, and the push that follows adds it back.
name: Renovate changeset

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read

jobs:
  changeset:
    # Renovate's own pushes only, never the App's commit
    if: >-
      github.event.pull_request.user.login == 'renovate[bot]' && github.actor ==
      'renovate[bot]'
    runs-on: ubuntu-26.04
    steps:
      - name: Create the App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          repositories: local-env
          permission-contents: write

      - name: Add the changeset
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR: ${{ github.event.pull_request.number }}
          BRANCH: ${{ github.head_ref }}
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          files=$(gh pr diff "$PR" --repo "$GITHUB_REPOSITORY" --name-only)
          if grep -q '^\.changeset/.*\.md$' <<< "$files"; then
            echo "The pull request has a changeset"
            exit 0
          fi

          # "update all dependencies" becomes "Update all dependencies."
          summary="${TITLE^}"
          printf -- "---\n'local-env': patch\n---\n\n%s.\n" "$summary" \
            > changeset.md

          # Through the API: the commit is signed and credited to the App
          gh api -X PUT \
            "repos/$GITHUB_REPOSITORY/contents/.changeset/renovate-$PR.md" \
            -f message="add changeset" \
            -f content="$(base64 -w0 changeset.md)" \
            -f branch="$BRANCH" > /dev/null
          echo "Changeset added"
