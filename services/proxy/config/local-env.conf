# Static proxy settings; the routes are generated by proxy-connector into
# /etc/nginx/routes/routes.conf

# Docker's DNS: resolves container names when a request comes in
resolver 127.0.0.11 valid=10s ipv6=off;

map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;

# Local development: long requests and large uploads are fine
proxy_connect_timeout 600;
proxy_send_timeout 600;
proxy_read_timeout 600;
send_timeout 600;
client_max_body_size 0;
proxy_buffering off;

server {
  listen 80 default_server;
  return 301 https://$host$request_uri;
}

include /etc/nginx/routes/*.conf;
