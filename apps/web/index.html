<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>local-env</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Cdefs%3E%3ClinearGradient id='cube' x1='6' y1='4' x2='42' y2='44' gradientUnits='userSpaceOnUse'%3E%3Cstop offset='0' stop-color='%23bd93f9' /%3E%3Cstop offset='1' stop-color='%23ff79c6' /%3E%3C/linearGradient%3E%3C/defs%3E%3Cpath d='M24 4 42 14 24 24 6 14Z' fill='url(%23cube)' /%3E%3Cpath d='M24 4 42 14 24 24 6 14Z' fill='%23fff' opacity='.35' /%3E%3Cpath d='M6 14 24 24V44L6 34Z' fill='url(%23cube)' /%3E%3Cpath d='M42 14 24 24V44L42 34Z' fill='url(%23cube)' /%3E%3Cpath d='M42 14 24 24V44L42 34Z' fill='%23000' opacity='.25' /%3E%3Cpath d='m10.5 22.5 7 5.5-7 2' fill='none' stroke='%23fff' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round' /%3E%3Ccircle cx='40' cy='8' r='5' fill='%2316a34a' /%3E%3C/svg%3E"
    />
    <script>
      // Before the page paints, so the theme doesn't flash: the same choice
      // as features/theme/theme-provider (light, dark or system)
      try {
        const theme = localStorage.getItem('theme')
        const dark =
          theme === 'dark' ||
          (theme !== 'light' &&
            matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.add(dark ? 'dark' : 'light')
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
