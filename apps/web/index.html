<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>local-env</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Cdefs%3E%3ClinearGradient id='d' x1='1' y1='1' x2='47' y2='47' gradientUnits='userSpaceOnUse'%3E%3Cstop offset='0' stop-color='%23bd93f9'/%3E%3Cstop offset='1' stop-color='%23ff79c6'/%3E%3C/linearGradient%3E%3Cmask id='g' maskUnits='userSpaceOnUse' x='0' y='0' width='48' height='48'%3E%3Crect width='48' height='48' fill='%23fff'/%3E%3Crect x='-2' y='6' width='44' height='44' rx='12' fill='%23000'/%3E%3C/mask%3E%3C/defs%3E%3Crect x='9' y='1' width='38' height='38' rx='9' fill='url(%23d)' opacity='.55' mask='url(%23g)'/%3E%3Crect x='1' y='9' width='38' height='38' rx='9' fill='url(%23d)'/%3E%3Cpath d='M9 31C11.8 23.6 16.6 23.1 20 28S28.2 32.4 31 25' fill='none' stroke='%23fff' stroke-width='5.4' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <script>
      // Before the page paints, so the theme doesn't flash: the same choice
      // as features/theme/theme-provider (light, dark or system)
      try {
        const theme = localStorage.getItem('theme')
        const dark =
          theme === 'dark' ||
          (theme !== 'light' &&
            matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.add(dark ? 'dark' : 'light')
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
