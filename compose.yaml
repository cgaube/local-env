name: local-env

networks:
  default:
    name: local-env
    driver: bridge

# The core services don't restart on their own (`restart: 'no'`): after a
# reboot, `local-env start` brings them back with the dashboard agent, a
# process on the Mac that nothing else starts (docs/3-how-it-works/dashboard-terminal.md)
services:
  nginx-proxy:
    build: services/proxy
    container_name: local-env-nginx-proxy
    restart: 'no'
    # Localhost only: *.dev.test resolves to 127.0.0.1, and Dockhand behind it
    # has no login
    ports: ['127.0.0.1:80:80', '127.0.0.1:443:443']
    labels:
      # Hash of services/<folder>: a change recreates the container
      local-env.revision: ${LOCAL_ENV_REVISION_PROXY:-}
      # Shown in the dashboard's Core services section
      local-env.description:
        'HTTPS proxy: serves every container with a VIRTUAL_HOST'
      dockhand.tags: 'local-env'
      # Built locally, no registry to check for updates
      dockhand.update: 'false'
    volumes:
      - './services/proxy/certs:/etc/nginx/certs:ro'
      # routes.conf, written by proxy-connector
      - './volumes/proxy:/etc/nginx/routes:ro'

  dockhand:
    image: fnsys/dockhand:latest
    container_name: local-env-dockhand
    restart: 'no'
    # Localhost only: no login, and it controls Docker. The host port is
    # uncommon, so an app on the Mac does not take it (DOCKHAND_URL in
    # apps/cli/src/providers/docker/api.ts).
    ports: ['127.0.0.1:17300:3000']
    labels:
      # Shown in the dashboard's Core services section
      local-env.description:
        'Docker UI: deploy and manage stacks from your templates'
      # A card at the top of the dashboard, with the number of docker/
      # templates in the sources
      local-env.app: 'Dockhand'
      dockhand.tags: 'local-env'
    environment:
      VIRTUAL_HOST: docker
      VIRTUAL_PORT: 3000
    volumes:
      - '/var/run/docker.sock:/var/run/docker.sock'
      - './volumes/dockhand:/app/data'

  # Serves the docker/ folder of every source to Dockhand
  catalog-server:
    image: oven/bun:1.4.4-alpine
    container_name: local-env-catalog
    restart: 'no'
    working_dir: /app
    command: ['bun', 'server.ts']
    labels:
      # Hash of services/<folder>: a change recreates the container
      local-env.revision: ${LOCAL_ENV_REVISION_CATALOG_SERVER:-}
      # Shown in the dashboard's Core services section
      local-env.description:
        "Serves your sources' templates and build folders to Dockhand"
      dockhand.tags: 'local-env'
    # https://catalog.<domain>: what it serves to Dockhand
    environment:
      VIRTUAL_HOST: catalog
      VIRTUAL_PORT: 8080
      # Replaces ${HOST_HOME} in templates: your Mac home folder
      HOST_HOME: ${HOME}
      # Written into template build URLs: the published port below
      BUILD_PORT: ${LOCAL_ENV_BUILD_PORT:-17080}
    # Docker's builder fetches template build contexts from here: it runs
    # outside the local-env network. `buildPort` in config.json.
    ports:
      - '127.0.0.1:${LOCAL_ENV_BUILD_PORT:-17080}:8080'
    volumes:
      - './services/catalog-server:/app:ro'
      - './volumes/sources:/sources:ro'
      # One single-commit repo per source, for build contexts
      - './volumes/build-contexts:/build-contexts:ro'
      # Every compose version served to Dockhand: the base of template updates
      - './volumes/template-snapshots:/snapshots'

  # Web page listing every proxied URL, like `local-env proxy routes`
  dashboard:
    build: services/dashboard
    container_name: local-env-dashboard
    restart: 'no'
    environment:
      VIRTUAL_HOST: local-env
      DOMAIN: ${LOCAL_ENV_DOMAIN:-dev.test}
      # The dashboard agent, on the Mac: runs install and update for the page
      AGENT_URL: http://host.docker.internal:${LOCAL_ENV_AGENT_PORT:-17081}
    labels:
      # Hash of services/<folder>: a change recreates the container
      local-env.revision: ${LOCAL_ENV_REVISION_DASHBOARD:-}
      # Shown in the dashboard's Core services section
      local-env.description: 'Lists routes, core services and sources'
      dockhand.tags: 'local-env'
      # Built locally, no registry to check for updates
      dockhand.update: 'false'
    volumes:
      # routes.json, written by proxy-connector
      - './volumes/proxy:/routes:ro'
      - './volumes/sources:/sources:ro'
      # The tools picked in the catalog: written here, installed by
      # `local-env install`
      - './volumes/tools:/tools'
      # The agent's token: only the dashboard can call it
      - './volumes/agent:/agent:ro'

  # Routes every container with a VIRTUAL_HOST: attaches it to the local-env
  # network and generates the nginx config. VIRTUAL_HOST=mail is served at
  # https://mail.<domain>
  proxy-connector:
    image: oven/bun:1.4.4-alpine
    container_name: local-env-proxy-connector
    restart: 'no'
    working_dir: /app
    command: ['bun', 'connector.ts']
    environment:
      PROXY_NETWORK: local-env
      PROXY_SERVICE: nginx-proxy
      DOMAIN: ${LOCAL_ENV_DOMAIN:-dev.test}
    labels:
      # Hash of services/<folder>: a change recreates the container
      local-env.revision: ${LOCAL_ENV_REVISION_PROXY_CONNECTOR:-}
      # Shown in the dashboard's Core services section
      local-env.description:
        'Connects containers with a VIRTUAL_HOST to the proxy'
      dockhand.tags: 'local-env'
    volumes:
      - './services/proxy-connector/connector.ts:/app/connector.ts:ro'
      - '/var/run/docker.sock:/var/run/docker.sock'
      - './volumes/proxy:/routes'
